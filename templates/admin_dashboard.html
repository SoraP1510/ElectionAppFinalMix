<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fdfbf7;
            --card-bg-color: #ffffff;
            --text-color: #4a4a4a;
            --heading-color: #333;
            --border-color: #eee;
            --accent-primary: #e88f58;
            --accent-primary-dark: #d97a40;
            --accent-secondary: #a38d78;
            --accent-danger: #c97a7a;
            --accent-success: #5e8b7e;
        }
        body {
            font-family: 'Prompt', sans-serif;
            color: var(--text-color);
            background: var(--bg-color);
            margin: 0;
            padding: 30px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 30px auto;
        }
        .header h1 {
            color: var(--heading-color);
            margin: 0;
            font-size: 28px;
        }
        .header .nav-links a {
            color: var(--accent-secondary);
            text-decoration: none;
            margin-left: 20px;
            font-size: 16px;
        }
        .header .nav-links a:hover {
            text-decoration: underline;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: var(--card-bg-color);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
        }
        .card h2, .card h3 {
            color: var(--heading-color);
            margin-top: 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            text-align: left;
        }
        th {
            color: var(--accent-secondary);
            font-weight: 600;
        }
        tbody tr:hover {
            background-color: #f9f9f9;
        }
        .btn {
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }
        .btn-primary { background: var(--accent-primary); color: #fff; }
        .btn-primary:hover { background: var(--accent-primary-dark); transform: translateY(-1px); }
        .btn-secondary { background: transparent; color: var(--accent-secondary); border-color: var(--accent-secondary); }
        .btn-secondary:hover { background: rgba(163, 141, 120, 0.1); transform: translateY(-1px); }
        .btn-danger { background: transparent; color: var(--accent-danger); border-color: var(--accent-danger); }
        .btn-danger:hover { background: rgba(201, 122, 122, 0.1); }
        .form-inline {
            display: flex;
            gap: 10px;
        }
        .form-inline input[type="text"] {
            flex-grow: 1;
            width: auto;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .form-inline input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-secondary);
            box-shadow: 0 0 0 3px rgba(163, 141, 120, 0.2);
        }
        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
        }
        .message.success { background: #eaf3f0; color: var(--accent-success); border: 1px solid var(--accent-success); }
        .message.error { background: #fbebee; color: var(--accent-danger); border: 1px solid var(--accent-danger); }
        .action-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .action-group .btn { width: 100%; box-sizing: border-box; text-align: center; }
        .danger-zone h3 { border-color: var(--accent-danger); }
    </style>
</head>
<body>
    <div class="header">
        <h1>Admin Dashboard</h1>
        <div class="nav-links">
            <a href="/">← กลับหน้าหลัก</a>
            <a href="/logout">ออกจากระบบ</a>
        </div>
    </div>

    <div class="dashboard-grid">
        <div class="card">
            <h2>👥 จัดการผู้สมัคร</h2>
            <table>
                <thead>
                    <tr><th>เบอร์</th><th>ชื่อ</th><th>คะแนน</th><th>จัดการ</th></tr>
                </thead>
                <tbody>
                    {% for cand in candidates %}
                    <tr>
                        <td>{{ cand.candidate_id }}</td>
                        <td>{{ cand.candidate_name }}</td>
                        <td>{{ cand.vote_count }}</td>
                        <td>
                            <form action="/admin/delete_candidate" method="POST" onsubmit="return confirm('ยืนยันลบ {{ cand.candidate_name }}?');">
                                <input type="hidden" name="id" value="{{ cand.candidate_id }}">
                                <button type="submit" class="btn btn-danger">ลบ</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
            <div style="margin-top: 30px;">
                <h3>➕ เพิ่มผู้สมัครใหม่</h3>
                <form action="/admin/add_candidate" method="POST" class="form-inline">
                    <input type="text" name="candidate_name" placeholder="ชื่อพรรค / ผู้สมัคร" required>
                    <button type="submit" class="btn btn-primary">บันทึก</button>
                </form>
            </div>
        </div>

        <div class="card">
            <h2>⚙️ เครื่องมือระบบ</h2>
            <div class="action-group">
                <div>
                    <h3>🖼️ จัดการรูปภาพ</h3>
                    <div id="normalize-message" class="message" style="display:none;"></div>
                    <button id="normalize-btn" class="btn btn-secondary" onclick="normalizeImages()">🔄 Normalize รูปภาพเก่าทั้งหมด</button>
                </div>
                <div>
                    <h3>🧠 เทรนโมเดล</h3>
                    <div id="train-message" class="message" style="display:none;"></div>
                    <button id="train-btn" class="btn btn-primary" onclick="retrainModel()">🚀 Train Model Now</button>
                    <form action="/admin/retrain_model_sync" method="POST" style="margin: 0;">
                         <button type="submit" class="btn btn-secondary" style="margin-top: 10px;">🛠️ Train Model (Fallback)</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="card danger-zone">
            <h3>⚠️ โซนอันตราย</h3>
            <div class="action-group">
                <form action="/admin/reset_votes" method="POST" onsubmit="return confirm('การดำเนินการนี้จะลบการโหวตทั้งหมดและรีเซ็ตสถานะของผู้ใช้ทุกคน คุณแน่ใจหรือไม่?');">
                    <button type="submit" class="btn btn-danger">🔄 รีเซ็ตระบบเลือกตั้งใหม่ทั้งหมด</button>
                </form>
            </div>
        </div>
    </div>
    
    <script>
        // Display messages passed via query parameters
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const trainStatus = urlParams.get('train_status');
            const trainMessage = urlParams.get('train_message');

            if (trainMessage) {
                const msgContainer = document.getElementById('train-message');
                msgContainer.textContent = trainMessage;
                msgContainer.className = 'message ' + (trainStatus === 'success' ? 'success' : 'error');
                msgContainer.style.display = 'block';
            }
        });

        function normalizeImages(){
            if(!confirm('ยืนยัน normalize รูปภาพทั้งหมด? การดำเนินการนี้อาจใช้เวลาสักครู่')) return;
            const btn = document.getElementById('normalize-btn');
            const msg = document.getElementById('normalize-message');
            btn.disabled = true; btn.innerHTML = '⏳ กำลังประมวลผล...'; msg.style.display = 'none';
            fetch('/admin/normalize_images',{method:'POST'})
                .then(r=>r.json())
                .then(d=>{
                    if(d.status === 'success'){
                        msg.className='message success';
                        msg.textContent = `✅ ${d.message} (สำเร็จ ${d.total_normalized} รูป, ผิดพลาด ${d.total_errors} รูป)`;
                    } else {
                        msg.className='message error';
                        msg.textContent = '❌ ' + d.message;
                    }
                    msg.style.display = 'block';
                })
                .catch(e => {
                    msg.className='message error';
                    msg.textContent = '❌ เกิดข้อผิดพลาด: ' + e.message;
                    msg.style.display='block';
                })
                .finally(() => {
                    btn.disabled = false; 
                    btn.innerHTML = '🔄 Normalize รูปภาพเก่าทั้งหมด';
                });
        }

        function retrainModel(){
            if(!confirm('ยืนยันเทรนโมเดลใหม่? การดำเนินการนี้อาจใช้เวลาสักครู่และจะแทนที่โมเดลปัจจุบัน')) return;
            const btn = document.getElementById('train-btn');
            const msg = document.getElementById('train-message');
            btn.disabled = true; btn.innerHTML = '⏳ กำลังเทรนโมเดล...'; msg.style.display = 'none';
            fetch('/admin/retrain_model',{method:'POST'})
                .then(r=>r.json())
                .then(d=>{
                    if(d.status === 'success'){
                        msg.className='message success';
                        msg.textContent = `✅ ${d.message} (Accuracy: ${d.accuracy_percent})`;
                    } else {
                        msg.className='message error';
                        msg.textContent = '❌ ' + d.message;
                    }
                    msg.style.display = 'block';
                })
                .catch(e => {
                    msg.className='message error';
                    msg.textContent = '❌ เกิดข้อผิดพลาด: ' + e.message;
                    msg.style.display='block';
                })
                .finally(() => {
                    btn.disabled = false; 
                    btn.innerHTML = '🚀 Train Model Now';
                });
        }
    </script>
</body>
</html>
