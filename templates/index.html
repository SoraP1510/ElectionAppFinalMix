<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเลือกตั้ง</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Prompt', sans-serif;
            color: #4a4a4a; /* Dark brown/charcoal text */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #fdfbf7; /* Light warm cream background */
        }
        .main-card {
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #eee;
            box-shadow: 0 6px 18px rgba(0,0,0,0.05);
            width: 95%;
            max-width: 1000px;
            display: flex;
            overflow: hidden;
            min-height: 550px;
        }
        .left-panel {
            flex: 1.2;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .left-panel h1 {
            font-weight: 700;
            font-size: 32px;
            color: #333;
            margin-top: 0;
            margin-bottom: 10px;
        }
        .left-panel p {
            color: #777;
            font-size: 16px;
            max-width: 350px;
        }
        .video-box {
            width: 100%;
            max-width: 320px;
            aspect-ratio: 4/3;
            background-color: #f0f0f0;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            border: 2px solid #a38d78; /* Soft earthy brown border */
            margin-top: 20px;
        }
        #video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .camera-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            font-size: 14px; color: #555;
            background-color: rgba(255,255,255,0.8);
            transition: opacity 0.3s ease;
        }
        .right-panel {
            flex: 1;
            background: #f9f6f2; /* Lighter cream for contrast */
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .right-panel h2 {
            font-weight: 600;
            color: #333;
            margin-bottom: 25px;
            font-size: 24px;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            background: #fff;
            color: #4a4a4a;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #a38d78; /* Earthy brown on focus */
            box-shadow: 0 0 0 3px rgba(163, 141, 120, 0.2);
        }
        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary { 
            background: #e88f58; /* Muted warm orange */
            color: #ffffff;
            border: 1px solid transparent;
            box-shadow: 0 4px 12px rgba(232, 143, 88, 0.3);
        }
        .btn-primary:hover { 
            background: #d97a40;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(232, 143, 88, 0.3);
        }
        .btn-secondary { 
            background: transparent;
            color: #a38d78; /* Earthy brown */
            border: 1px solid #a38d78;
        }
        .btn-secondary:hover { 
            background: rgba(163, 141, 120, 0.1);
            transform: translateY(-2px);
        }
        .error { 
            color: #c97a7a; /* Soft red */
            margin-top: 15px;
            font-weight: 500;
            min-height: 20px;
            font-size: 14px;
        }
        .admin-link { 
            margin-top: 25px;
            font-size: 14px;
            color: #a38d78;
            text-decoration: none;
            display: inline-block;
        }
        .admin-link:hover { text-decoration: underline; }
        
        @media (max-width: 800px) {
            .main-card { flex-direction: column; min-height: auto; width: 95%; }
            .right-panel { border-top: 1px solid #eee; }
        }
    </style>
</head>
<body>
    <div class="main-card">
        <div class="left-panel">
            <div>
                <h1>ระบบเลือกตั้ง Face-Scan</h1>
                <p>โปรดยืนยันตัวตนด้วยรหัสนักเรียนและใบหน้าของคุณเพื่อเข้าสู่ระบบ</p>
            </div>
            <div class="video-box">
                <video id="video" autoplay playsinline></video>
                <div id="camera-overlay" class="camera-overlay">กำลังรอการอนุญาตเข้าถึงกล้อง...</div>
            </div>
            <p style="font-size: 14px; color: #aaa; margin-top: auto; padding-top: 20px;">Secured by Facial Recognition</p>
        </div>
        <div class="right-panel">
            <h2>เข้าสู่ระบบ</h2>
            <input type="text" id="studentid" placeholder="รหัสนักเรียน" required>
            <button class="btn-primary" onclick="capture()">📸 เข้าสู่ระบบด้วยใบหน้า</button>
            <button class="btn-secondary" onclick="location.href='/register'">ลงทะเบียนใหม่</button>
            <p class="error" id="error-msg"></p>
            <canvas id="canvas" style="display: none;"></canvas>
            <a href="/admin" class="admin-link">สำหรับผู้ดูแลระบบ</a>
        </div>
    </div>
    <script>
        const video = document.getElementById('video');
        const errorMsg = document.getElementById('error-msg');
        const cameraOverlay = document.getElementById('camera-overlay');
        const studentidInput = document.getElementById('studentid');
        function initializeCamera() {
            cameraOverlay.innerText = "กำลังรอการอนุญาตเข้าถึงกล้อง...";
            video.style.opacity = 0;
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => { video.srcObject = stream; video.onloadedmetadata = () => { video.play(); cameraOverlay.style.display = 'none'; video.style.opacity = 1; }; })
                .catch(err => { errorMsg.innerText = "❌ ไม่สามารถเปิดกล้องได้: โปรดอนุญาตการใช้เว็บแคม"; cameraOverlay.style.display = 'flex'; video.style.opacity = 0; });
        }
        initializeCamera();
        window.capture = function() {
            const studentid = studentidInput.value.trim();
            if (!studentid) { errorMsg.innerText = "⚠️ กรุณากรอกรหัสนักเรียนที่ลงทะเบียน"; return; }
            if (video.readyState < 2 || video.paused || video.ended || video.style.opacity === "0") { errorMsg.innerText = "⚠️ กล้องยังไม่พร้อมใช้งาน หรือยังไม่ได้รับอนุญาต"; return; }
            errorMsg.innerText = "⏳ กำลังตรวจสอบ...";
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(blob => {
                const formData = new FormData();
                formData.append('studentid', studentid);
                formData.append('image', blob, 'face.png');
                fetch('/', { method: 'POST', body: formData })
                    .then(res => res.ok ? res.json() : res.json().then(j => { throw new Error(j.message || 'Server error'); }))
                    .then(data => { if (data.status === 'success') { window.location.href = data.redirect_url; } else { errorMsg.innerText = "❌ " + (data.message || 'เกิดข้อผิดพลาด'); } })
                    .catch(err => { errorMsg.innerText = "🔥 ข้อผิดพลาด: " + err.message; });
            }, 'image/png');
        }
    </script>
</body>
</html>
