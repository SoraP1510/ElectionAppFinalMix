<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🗳️ คูหาเลือกตั้งออนไลน์</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fdfbf7;
            --card-bg-color: #ffffff;
            --text-color: #4a4a4a;
            --heading-color: #333;
            --border-color: #eee;
            --accent-primary: #e88f58;
            --accent-primary-dark: #d97a40;
            --accent-secondary: #a38d78;
            --accent-success: #5e8b7e;
        }
        body {
            margin: 0;
            font-family: 'Prompt', sans-serif;
            color: var(--text-color);
            background: var(--bg-color);
            padding: 30px;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        .header h1 {
            color: var(--heading-color);
            margin: 0 0 5px 0;
            font-size: 28px;
        }
        .header p {
            font-size: 16px;
            color: #777;
            margin: 0;
        }
        .header p b {
            color: var(--heading-color);
        }
        .header .status {
            color: var(--accent-success);
            font-weight: 600;
        }
        .card-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }
        .candidate-card {
            background: var(--card-bg-color);
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--border-color);
            padding: 25px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .candidate-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.07);
        }
        .candidate-number {
            height: 80px;
            width: 80px;
            background: var(--accent-secondary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
        }
        .candidate-card h3 {
            margin: 0 0 20px 0;
            color: var(--heading-color);
            font-size: 20px;
            font-weight: 600;
        }
        .btn-vote {
            background: var(--accent-primary);
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.2s ease;
        }
        .btn-vote:hover {
            background: var(--accent-primary-dark);
            transform: translateY(-2px);
        }
        @media (max-width: 800px) {
            body { padding: 20px; }
            .header h1 { font-size: 24px; }
            .card-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🗳️ บัตรเลือกตั้ง</h1>
            <p>สวัสดีคุณ <b>{{ name }} {{ surname }}</b> ({{ studentid }}) | สถานะ: <span class="status">ยืนยันตัวตนสำเร็จแล้ว</span></p>
        </div>
        <div class="card-container">
            {% for cand in candidates %}
            <div class="candidate-card">
                <div class="candidate-number">{{ cand.candidate_id }}</div>
                <h3>{{ cand.candidate_name }}</h3>
                <form action="/submit_vote" method="POST" onsubmit="return confirm('คุณยืนยันจะลงคะแนนให้ {{ cand.candidate_name }} (หมายเลข {{ cand.candidate_id }}) ใช่หรือไม่? การโหวตทำได้เพียงครั้งเดียว');">
                    <input type="hidden" name="candidate_id" value="{{ cand.candidate_id }}">
                    <button type="submit" class="btn-vote">✅ ลงคะแนนให้เบอร์นี้</button>
                </form>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
