<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            color: #4a4a4a;
            background: #fdfbf7;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 6px 18px rgba(0,0,0,0.05);
            border: 1px solid #eee;
            width: 90%;
            max-width: 400px;
        }
        h2 {
            font-weight: 600;
            color: #333;
            margin-top: 0;
            margin-bottom: 25px;
        }
        input[type="password"] {
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            background: #fff;
            color: #4a4a4a;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        input[type="password"]:focus {
            outline: none;
            border-color: #a38d78; /* Earthy brown on focus */
            box-shadow: 0 0 0 3px rgba(163, 141, 120, 0.2);
        }
        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.2s ease;
            background: #e88f58; /* Muted warm orange */
            color: #ffffff;
            border: 1px solid transparent;
            box-shadow: 0 4px 12px rgba(232, 143, 88, 0.3);
        }
        button:hover { 
            background: #d97a40;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(232, 143, 88, 0.3);
        }
        a {
            margin-top: 25px;
            font-size: 14px;
            color: #a38d78;
            text-decoration: none;
            display: inline-block;
        }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🔐 Admin Login</h2>
        <form method="POST">
            <input type="password" name="password" placeholder="รหัสผ่านผู้ดูแลระบบ" required>
            <button type="submit">เข้าสู่ระบบ</button>
        </form>
        <a href="/">← กลับหน้าหลัก</a>
    </div>
</body>
</html>
